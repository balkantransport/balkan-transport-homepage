<article class="card height-100 rounded-0 border-bottom border-primary border-top-0 border-left-0 border-right-0 hover-shadow">
  <img class="card-img-top rounded-0" src="{{ .Params.image | relURL }}" alt="{{ .Title }}">

  <div class="card-body">
    <!-- BT META -->
    {{ partial "card-meta.html" . }}

    <h4 class="card-title">
      <a href="{{ .Permalink }}">{{ .Title }}</a>
    </h4>

    <p class="card-text">{{ .Summary | truncate 100 }}</p>

    <a href="{{ .Permalink }}" class="btn btn-card-solid-premium">
      {{ i18n "read_more" }}
    </a>
  </div>
</article>
