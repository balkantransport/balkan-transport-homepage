{{ define "main" }}

{{ $data := index site.Data site.Language.Lang }}

<section class="section-sm">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <img src="{{ .Params.image | relURL }}" alt="blog-thumb" class="img-fluid w-100 mb-20">
      </div>
    </div>
    
    <div class="container">
        <div class="row" style="justify-content: center;">
          <div class="col-12 content" style="margin-bottom: unset;">
            {{ .Content }}
          </div>
        </div>

        <div class="d-flex align-items-center section-title justify-content-between mb-20">
            <h2 class="mb-0 text-nowrap mr-3">Video</h2>
            <div class="border-top w-100 border-primary d-none d-sm-block"></div>
        </div>
        
        <div class="row mb-30" style="justify-content: center;">
          <div class="col-12">
            <div class="video-embed">
              <iframe
                src="{{ .Params.videoUrl }}"
                title="{{ .Params.title }}"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen
                referrerpolicy="strict-origin-when-cross-origin">
              </iframe>
            </div>
          </div>
        </div>

        <hr class="mb-30">

        {{ if .Site.Config.Services.Disqus.Shortname }}
        <div class="col-12">
          {{ template "_internal/disqus.html" . }}
        </div>
        {{ end }}
    </div>
  </div>
</section>

{{ end }}
