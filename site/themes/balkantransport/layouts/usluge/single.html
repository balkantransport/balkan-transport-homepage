{{ define "main" }}

<!-- section -->
<section class="section-service">
  <div class="container">
    <div class="row">
      <div class="col-12 mb-4">
        <!-- service thumb -->
        <img style="height: 100%;width: 100%;object-fit: cover;" src="{{ .Params.image | relURL }}"
          class="img-fluid w-100">
      </div>
    </div>
    <!-- service info -->
    <div class="bt-service-meta">
      <div class="bt-service-meta__title">
        <h2 class="mb-0">{{ .Title }}</h2>
      </div>

      <div class="bt-service-meta__fee">
        <div class="bt-service-meta__fee-inner">
          <i class="ti-wallet bt-service-meta__icon" aria-hidden="true"></i>
          <div>
            <div class="bt-service-meta__label">{{ i18n "fee" | upper }}</div>
            <div class="bt-service-meta__value">{{ .Params.Fee }}</div>
          </div>
        </div>
      </div>

      <div class="bt-service-meta__cta">
        <a href="/kontakt" class="btn btn-card-solid-premium bt-service-meta__btn">
          {{ i18n "posaljite_upit" }}
        </a>
      </div>

      <div class="bt-service-meta__divider">
        <div class="border-bottom border-primary"></div>
      </div>
    </div>
    <!-- service details -->
    <div class="row">
      <div class="col-12 mb-4 content">
        {{ .Content }}
      </div>
