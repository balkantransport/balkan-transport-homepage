{{ define "main" }}

{{ $data := index site.Data site.Language.Lang }}

<!-- event single -->
<section class="section-sm">
  <div class="container">
    <div class="row">
      <!-- event image -->
      <div class="col-12">
        <img src="{{ .Params.image | relURL }}" alt="blog-thumb" class="img-fluid w-100">
      </div>
    </div>
    <!-- event info -->
    <div class="row align-items-center mb-5">
    </div>
    <!-- event details -->
    <div class="row">
      <div class="col-12 mb-20 content">
        {{ .Content }}
      </div>
    </div>
  </div>
  <!-- Pasusi ispod counter-a -->
  <div class="container">
    <!-- Vozni park header -->
    <div class="d-flex align-items-center section-title justify-content-between">
      <h2 class="mb-0 text-nowrap mr-3">Vozila</h2>
      <div class="border-top w-100 border-primary d-none d-sm-block"></div>
    </div>

    <!-- Vozni park -->
    <div class="row justify-content-center">
      {{ range where site.RegularPages "Type" "partneri/presto/vozilo"}}
      <div class="col-lg-4 col-sm-6 mb-5">
        {{ .Render "vehicle" }}
      </div>
      {{ end }}
    </div>

    <!-- Kontakt -->
    <div class="d-flex align-items-center section-title justify-content-between">
      <h2 class="mb-0 text-nowrap mr-3">Kontakt</h2>
      <div class="border-top w-100 border-primary d-none d-sm-block"></div>
    </div>

    <div class="row" style="justify-content: center;">
      <div class="col-12 content" style="margin-bottom: unset;">
        <div class="center-content">
          <img src="{{ .Params.kontakt | relURL }}" alt="blog-thumb" class="img-fluid d-block mx-auto" style="max-width:70%; width:100%;">
        </div>
      </div>
    </div>

  </div>

</section>

{{ end }}
