<div class="bt-card-meta mb-3">
  <!-- DATE -->
  <div class="bt-card-meta__item bt-card-meta__item--date">
    <i class="ti-calendar bt-card-meta__icon" aria-hidden="true"></i>
    <span class="bt-card-meta__value">
      {{ .PublishDate.Format "02 Jan, 2006" }}
    </span>
  </div>

  <!-- AUTHOR -->
  <div class="bt-card-meta__item bt-card-meta__item--author">
    <i class="ti-user bt-card-meta__icon" aria-hidden="true"></i>
    <a class="bt-card-meta__value"
       href="{{ `author/` | relLangURL }}{{ .Params.Author | urlize }}">
      {{ .Params.Author | title }}
    </a>
  </div>
</div>
